apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: workshop
  labels:
    role: frontend
    env: demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 25%
  selector:
    matchLabels:
      role: frontend
  template:
    metadata:
      labels:
        role: frontend
        app.kubernetes.io/instance: three-tier-app
    spec:
      containers:
      - name: frontend
        image: 132551339390.dkr.ecr.us-east-1.amazonaws.com/frontend:v11-19030c7
        imagePullPolicy: Always
        env:
          - name: VITE_BACKEND_URL
            value: "https://app.prashantgawali.site/api/tasks"
        ports:
        - containerPort: 3000
        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: 3000
        #   initialDelaySeconds: 2
        #   periodSeconds: 5
        # readinessProbe:
        #   httpGet:
        #      path: /
        #      port: 3000
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
        #   successThreshold: 1
