# ClusterSecretStore – tells External Secrets Operator how to reach AWS Secrets Manager.
#
# Authentication uses IRSA (IAM Roles for Service Accounts).
# The annotation on the ESO service account must reference a role that has the
# following permissions on the secrets it needs to read:
#
#   secretsmanager:GetSecretValue
#   secretsmanager:DescribeSecret
#
# The IAM role trust policy must allow:
#   sts:AssumeRoleWithWebIdentity
# for the ESO service account in the external-secrets namespace.
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1            # Change to your AWS region

      # IRSA: ESO will use the pod's service-account token; no static credentials needed.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
