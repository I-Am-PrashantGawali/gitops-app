# !! DO NOT APPLY THIS FILE IN PRODUCTION !!
#
# This static Secret with hard-coded base64 credentials is kept only as a
# local-dev / quick-test fallback.
#
# In all real environments (dev, staging, prod) the Secret named "mongo-sec"
# is managed by External Secrets Operator via external-secret.yaml, which
# pulls credentials from AWS Secrets Manager (gitops/workshop/mongodb).
#
# If you apply both files, the ExternalSecret will immediately overwrite this
# Secret on its next reconciliation cycle (default: 1 h).
#
# To use locally without ESO:
#   kubectl apply -f secrets.yaml -n workshop
---
apiVersion: v1
kind: Secret
metadata:
  namespace: workshop
  name: mongo-sec
type: Opaque
data:
  password: cGFzc3dvcmQxMjM=   # password123  – DEV ONLY
  username: YWRtaW4=            # admin         – DEV ONLY
