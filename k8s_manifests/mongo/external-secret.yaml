# ExternalSecret – pulls MongoDB credentials from AWS Secrets Manager
# and materialises them as the Kubernetes Secret named "mongo-sec".
#
# Prerequisites:
#   1. External Secrets Operator installed in the cluster.
#   2. A ClusterSecretStore (or SecretStore) named "aws-secrets-manager"
#      configured with IRSA / IAM permissions to read from AWS Secrets Manager.
#   3. A secret in AWS Secrets Manager at the path below containing the keys
#      "username" and "password".
#
# AWS Secrets Manager secret name: gitops/workshop/mongodb
# Example value (JSON):
#   { "username": "admin", "password": "password123" }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mongo-sec
  namespace: workshop
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager      # Must match your ClusterSecretStore name
    kind: ClusterSecretStore

  target:
    name: mongo-sec                # Kubernetes Secret that will be created
    creationPolicy: Owner
    template:
      type: Opaque

  data:
    - secretKey: username          # Key inside the K8s Secret
      remoteRef:
        key: gitops/workshop/mongodb   # AWS Secrets Manager secret name
        property: username             # JSON key inside the secret value

    - secretKey: password
      remoteRef:
        key: gitops/workshop/mongodb
        property: password
