name: Provision AWS Secrets Manager

# Run once manually to seed MongoDB credentials into AWS Secrets Manager.
# After that, ExternalSecret resources in the cluster pull them automatically.
#
# REQUIRED GitHub Secrets:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  – permission to write to Secrets Manager
#   MONGO_USERNAME / MONGO_PASSWORD            – values to store

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS Region"
        required: true
        default: "us-east-1"
      secret_name:
        description: "AWS Secrets Manager secret path"
        required: true
        default: "gitops/workshop/mongodb"

jobs:
  provision:
    name: Create / Update MongoDB Secret
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Upsert secret
        run: |
          SECRET_VALUE=$(jq -cn \
            --arg u "${{ secrets.MONGO_USERNAME }}" \
            --arg p "${{ secrets.MONGO_PASSWORD }}" \
            '{ username: $u, password: $p }')
          SECRET_NAME="${{ github.event.inputs.secret_name }}"

          if aws secretsmanager describe-secret --secret-id "${SECRET_NAME}" 2>/dev/null; then
            aws secretsmanager put-secret-value \
              --secret-id "${SECRET_NAME}" \
              --secret-string "${SECRET_VALUE}"
            echo "Updated: ${SECRET_NAME}"
          else
            aws secretsmanager create-secret \
              --name "${SECRET_NAME}" \
              --description "MongoDB credentials for gitops/workshop" \
              --secret-string "${SECRET_VALUE}" \
              --tags Key=Environment,Value=workshop Key=ManagedBy,Value=github-actions
            echo "Created: ${SECRET_NAME}"
          fi
